[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lorascape"
version = "0.1.0"
description = "SmartCity LoRaWAN Network Simulator"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lorascape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]